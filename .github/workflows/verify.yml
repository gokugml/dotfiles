name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run isolated smoke tests
        run: ./tests/smoke.zsh

      - name: Install mise host
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install mise

      - name: Initialize the default Git hook once
        run: ./.githooks/install.sh

      - name: Run checks through the default Git hook
        run: .git/hooks/pre-commit

      - name: Scan complete Git history with pinned Gitleaks
        run: >-
          mise --no-config exec ubi:gitleaks/gitleaks@8.30.0 --
          gitleaks git --redact --no-banner --log-opts=--all .
