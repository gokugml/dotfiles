[tools]
bun = "1.3.5" # 功能=提供默认 JS-TS runtime；最佳实践=replace；修改级别=一定要改；建议=采用当前已验证 ARM 精确版本并移除直接 Bun PATH；归属=public；验证=mise exec -- bun --version
"ubi:gitleaks/gitleaks" = "8.30.0" # 功能=提供仓库密钥扫描；最佳实践=rewrite；修改级别=一定要改；建议=避开已报告漏检回归的 8.30.1 并固定官方上游版本；归属=public；验证=mise exec -- gitleaks version 并用无真实密钥 fixture 验证检测
node = "24.14.1" # 功能=提供 Node 兼容运行时；最佳实践=replace；修改级别=一定要改；建议=采用当前默认精确版本并替代 NVM；归属=public；验证=mise exec -- node --version 且 file 显示 arm64
pnpm = "10.33.0" # 功能=提供 Node 项目包管理器；最佳实践=replace；修改级别=一定要改；建议=采用当前精确版本并删除错误 PNPM_HOME；归属=public；验证=mise exec -- pnpm --version
